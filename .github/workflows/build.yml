["أسود وذهبي","Black & gold","ڕەش و زێڕین"],["أخضر","Green","سەوز"],["أزرق ملكي","Royal blue","شینی شاهانە"],["بنفسجي","Purple","مۆر"],["عنابي","Burgundy","عونابی"],["سياسة الخصوصية","Privacy Policy","سیاسەتی نهێنی"],["لا يجمع التطبيق أي بيانات عنك، ولا يتطلب إنشاء حساب أو تسجيل دخول.","The app does not collect any data about you and does not require an account or sign-in.","بەرنامەکە هیچ داتایەک دەربارەی تۆ کۆناکاتەوە و پێویستی بە دروستکردنی هەژمار یان چوونەژوورەوە نییە."],["البيانات التي تُدخلها (الشخصية والوظيفية والوثائق والكتب الرسمية ومرفقاتها) تُخزَّن محليًا على جهازك فقط.","The data you enter (personal, job, documents, official letters and their attachments) is stored locally on your device only.","ئەو داتایانەی دەیانخەیتە ناوەوە (کەسی، کار، بەڵگەکان، نامە فەرمییەکان و پێوەکراوەکانیان) تەنها لەسەر ئامێرەکەت هەڵدەگیرێن."],["لا نشارك بياناتك مع أي طرف ثالث، ولا نستخدم إعلانات أو أدوات تتبع.","We do not share your data with any third party, and we use no ads or tracking tools.","داتاکانت لەگەڵ هیچ لایەنی سێیەمدا هاوبەش ناکەین و هیچ ڕیکلام یان ئامرازی شوێنکەوتن بەکارنایەنین."],["عند اختيار خط من الإنترنت يتصل جهازك بخدمة Google Fonts لتحميله، وقد تصلها معلومات اتصال عادية مثل عنوان IP.","When you choose an online font, your device connects to Google Fonts to load it, and ordinary connection details such as your IP address may reach it.","کاتێک فۆنتێک لە ئینتەرنێت هەڵدەبژێریت، ئامێرەکەت پەیوەندی بە Google Fonts دەکات بۆ بارکردنی، و لەوانەیە زانیاری ئاسایی پەیوەندی وەک ناونیشانی IP بگاتە ئەوێ."],["ملفات النسخة الاحتياطية وملفات التصدير (Excel وPDF) تُحفظ في المكان الذي تختاره، وأنت المسؤول عن حمايتها.","Backup and export files (Excel and PDF) are saved wherever you choose, and you are responsible for protecting them.","فایلی کۆپیی یەدەگ و هەناردەکردن (Excel و PDF) لەو شوێنەدا هەڵدەگیرێن کە تۆ هەڵیدەبژێریت، و تۆ بەرپرسیت لە پاراستنیان."],["يمكنك حذف أي ملف موظف في أي وقت، ومسح كل البيانات من إعدادات المتصفح أو التطبيق.","You can delete any employee file at any time, and clear all data from the browser or app settings.","دەتوانیت هەر فایلێکی فەرمانبەر لە هەر کاتێکدا بسڕیتەوە، و هەموو داتاکان لە ڕێکخستنەکانی وێبگەڕ یان بەرنامە پاک بکەیتەوە."],["للاستفسار عن الخصوصية تواصل معنا عبر واتساب من قسم التواصل.","For privacy questions, contact us via WhatsApp from the Contact section.","بۆ پرسیار دەربارەی نهێنی، لە بەشی پەیوەندی لە ڕێگەی WhatsApp پەیوەندیمان پێوە بکە."],["قد تُحدَّث سياسة الخصوصية هذه عند صدور إصدارات جديدة.","This privacy policy may be updated when new versions are released.","لەوانەیە ئەم سیاسەتی نهێنییە لە وەشانە نوێیەکان نوێ بکرێتەوە."],["الشروط والأحكام","Terms & Conditions","مەرج و ڕێساکان"],["جميع البيانات التي تُدخلها تُحفظ محليًا على جهازك فقط، ولا تُرسل إلى أي خادم.","All the data you enter is stored locally on your device only and is not sent to any server.","هەموو ئەو داتایانەی دەیانخەیتە ناوەوە تەنها لەسەر ئامێرەکەت هەڵدەگیرێن و بۆ هیچ سێرڤەرێک نانێردرێن."],["أنت المسؤول عن دقة البيانات وعن حمايتها، وعن حماية جهازك من الوصول غير المصرّح به.","You are responsible for the accuracy and protection of the data, and for protecting your device from unauthorized access.","تۆ بەرپرسیت لە دروستی و پاراستنی داتاکان و لە پاراستنی ئامێرەکەت لە دەستگەیشتنی نایاسایی."],["يُنصح بإنشاء نسخة احتياطية بشكل دوري، فحذف بيانات المتصفح أو التطبيق أو تغيير الجهاز قد يؤدي إلى فقدان البيانات.","Make backups regularly: clearing browser or app data, or changing devices, may cause data loss.","پێشنیار دەکرێت کۆپیی یەدەگ بە شێوەی بەردەوام دروست بکەیت، چونکە سڕینەوەی داتای وێبگەڕ یان بەرنامە یان گۆڕینی ئامێر دەبێتە هۆی لەدەستدانی داتا."],["يحتوي التطبيق على بيانات شخصية حساسة، فلا تشاركها أو تطبعها إلا لجهة مخوّلة بذلك.","The app holds sensitive personal data; do not share or print it except with an authorized party.","بەرنامەکە داتای کەسی هەستیار لەخۆ دەگرێت، بۆیە تەنها بۆ لایەنێکی ڕێپێدراو هاوبەشی مەکە و چاپی مەکە."],["عند اختيار خطوط من الإنترنت قد يُحمَّل الخط من خدمة Google Fonts، وزر واتساب يفتح تطبيقًا خارجيًا يخضع لشروطه.","Choosing online fonts may load them from Google Fonts, and the WhatsApp button opens an external app governed by its own terms.","هەڵبژاردنی فۆنت لە ئینتەرنێت لەوانەیە لە Google Fonts باربکرێت، و دوگمەی WhatsApp بەرنامەیەکی دەرەکی دەکاتەوە کە ڕێساکانی خۆی هەیە."],["يُقدَّم التطبيق كما هو دون أي ضمان، ولا يتحمل مطوّره مسؤولية أي خسارة ناتجة عن استخدامه.","The app is provided as is without any warranty, and its developer is not liable for any loss resulting from its use.","بەرنامەکە وەک خۆی پێشکەش دەکرێت بەبێ هیچ گەرەنتییەک، و پەرەپێدەرەکەی بەرپرس نییە لە هیچ زیانێک کە لە بەکارهێنانی بێتە ئاراوە."],["استمرارك في استخدام التطبيق يعني موافقتك على هذه الشروط، وقد تُحدَّث عند صدور إصدارات جديدة.","By continuing to use the app you agree to these terms, which may be updated in new versions.","بەردەوامبوونت لە بەکارهێنانی بەرنامەکە واتە ڕازیبوونت بەم مەرجانە، و لەوانەیە لە وەشانە نوێیەکان نوێ بکرێنەوە."],["التواصل","Contact","پەیوەندی"],["💬 تواصل عبر واتساب","💬 Contact via WhatsApp","💬 پەیوەندی بە WhatsApp"],["المظهر","Appearance","ڕووکار"],["الخط","Font","فۆنت"],["الافتراضي","Default","بنەڕەت"],["خط مخصص","Custom font","فۆنتی تایبەت"],["＋ رفع ملف خط (مثل البغدادي)","＋ Upload a font file (e.g. Baghdadi)","＋ بارکردنی فایلی فۆنت (وەک بەغدادی)"],["تم تطبيق الخط","Font applied","فۆنت جێبەجێ کرا"],["حجم الخط كبير (الحد 1.5 ميغابايت)","Font file too large (max 1.5 MB)","فایلی فۆنت زۆر گەورەیە (زۆرترین 1.5 مێگابایت)"],["الملف ليس خطًا صالحًا","Not a valid font file","فایلەکە فۆنتێکی دروست نییە"],
["⚙️ الإعدادات","⚙️ Settings","⚙️ ڕێکخستنەکان"],["اللغة","Language","زمان"],["لون التطبيق","App color","ڕەنگی بەرنامە"],["وضع العرض","Display mode","دۆخی پیشاندان"],["فاتح","Light","ڕووناک"],["داكن","Dark","تاریک"],["زوايا العناصر","Corner style","شێوەی گوشەکان"],["مدورة","Rounded","خڕ"],["حادة","Square","تیژ"],["حجم الخط","Font size","قەبارەی نووسین"],["صغير","Small","بچووک"],["متوسط","Medium","ناوەند"],["كبير","Large","گەورە"],["إعادة الضبط","Reset","گەڕاندنەوە بۆ بنەڕەت"],["إغلاق","Close","داخستن"]
].forEach(a=>T[a[0]]=[a[1],a[2]]);
let LANG="ar";const nodeMap=new WeakMap();
function trText(t){if(LANG==="ar")return t;let m=t.match(/^تنتهي بعد (\d+) يوم$/);if(m)return LANG==="en"?"Expires in "+m[1]+" days":m[1]+" ڕۆژی ماوە";let x=T[t];return x?x[LANG==="en"?0:1]:t}
function tr(t){return trText(t)}
const obs=new MutationObserver(()=>xlate());
function xlate(){obs.disconnect();let w=document.createTreeWalker(document.documentElement,NodeFilter.SHOW_TEXT),n;while(n=w.nextNode()){let p=n.parentNode.nodeName;if(p==="SCRIPT"||p==="STYLE"||p==="TEXTAREA")continue;let rec=nodeMap.get(n),cur=n.data;if(!rec||cur!==rec.t){rec={o:cur,t:cur};nodeMap.set(n,rec)}let k=rec.o.trim();if(!k)continue;let res=rec.o.replace(k,trText(k));if(res!==cur)n.data=res;rec.t=n.data}
document.querySelectorAll("[placeholder]").forEach(e=>{if(e._po===undefined)e._po=e.getAttribute("placeholder");e.setAttribute("placeholder",trText(e._po))});
obs.observe(document.documentElement,{childList:true,subtree:true,characterData:true})}
const FONTS={def:{n:"الافتراضي",f:"Arial,Tahoma,sans-serif"},cairo:{n:"Cairo كايرو",g:"Cairo",f:'"Cairo"'},tajawal:{n:"Tajawal تجوال",g:"Tajawal",f:'"Tajawal"'},amiri:{n:"Amiri أميري",g:"Amiri",f:'"Amiri"'},sch:{n:"Scheherazade شهرزاد",g:"Scheherazade+New",f:'"Scheherazade New"'},ruqaa:{n:"Aref Ruqaa رقعة",g:"Aref+Ruqaa",f:'"Aref Ruqaa"'},kufi:{n:"Noto Kufi كوفي",g:"Noto+Kufi+Arabic",f:'"Noto Kufi Arabic"'},reem:{n:"Reem Kufi ريم كوفي",g:"Reem+Kufi",f:'"Reem Kufi"'},custom:{n:"خط مخصص",f:'"UserFont"'}};
function loadGF(keys){let fam=keys.filter(k=>FONTS[k]&&FONTS[k].g&&!FONTS[k]._l);if(!fam.length)return;fam.forEach(k=>FONTS[k]._l=1);let l=document.createElement("link");l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?"+fam.map(k=>"family="+FONTS[k].g+":wght@400;700").join("&")+"&display=swap";document.head.appendChild(l)}
function regCustom(){let d;try{d=localStorage.getItem("pro_font")}catch(e){}if(!d)return;new FontFace("UserFont","url("+d+")").load().then(f=>document.fonts.add(f)).catch(()=>{})}
function loadFont(e){let f=e.target.files[0];e.target.value="";if(!f)return;if(f.size>1500000){toast("حجم الخط كبير (الحد 1.5 ميغابايت)");return}let r=new FileReader();r.onload=()=>{let d=r.result;new FontFace("UserFont","url("+d+")").load().then(ff=>{document.fonts.add(ff);try{localStorage.setItem("pro_font",d)}catch(x){toast("المساحة ممتلئة: قلّل حجم المرفقات أو أنشئ نسخة احتياطية");return}setOpt("font","custom");toast("تم تطبيق الخط")}).catch(()=>toast("الملف ليس خطًا صالحًا"))};r.readAsDataURL(f)}
function pickFont(k){if(k==="custom"&&!localStorage.getItem("pro_font")){fontFile.click();return}setOpt("font",k)}
let S={lang:"ar",theme:"gold",font:"def",radius:"round",size:"m"};try{Object.assign(S,JSON.parse(localStorage.getItem("pro_settings")||"{}"))}catch(e){}
function saveS(){try{localStorage.setItem("pro_settings",JSON.stringify(S))}catch(e){}}
function setOpt(g,v){S[g]=v;saveS();applySettings()}
function setMode(d){document.body.classList.toggle("dark",d);try{localStorage.setItem("pro_dark",d)}catch(e){}markActive()}
function resetSettings(){S={lang:S.lang,theme:"gold",font:"def",radius:"round",size:"m"};saveS();setMode(false);applySettings()}
function togg(l){let o=!l.classList.contains('open');l.classList.toggle('open',o);let n=l.nextElementSibling;while(n&&!n.classList.contains('setlbl')&&!n.classList.contains('actions')){n.style.display=o?'':'none';n=n.nextElementSibling}}
function openSettings(){loadGF(Object.keys(FONTS));markActive();openModal("setModal")}
function markActive(){document.querySelectorAll(".opt,.sw").forEach(b=>{let g=b.dataset.g,v=b.dataset.v;b.classList.toggle("active",g==="mode"?document.body.classList.contains("dark")===(v==="dark"):S[g]===v)})}
function applySettings(){let r=document.documentElement,th=THEMES[S.theme]||THEMES.gold;Object.keys(th).forEach(k=>r.style.setProperty("--"+k,th[k]));if(!FONTS[S.font])S.font="def";loadGF([S.font]);r.style.setProperty("--ff",FONTS[S.font].f+",Arial,Tahoma,sans-serif");LANG=S.lang;r.lang=LANG==="ku"?"ckb":LANG;r.dir=LANG==="en"?"ltr":"rtl";let b=document.body;b.classList.toggle("sq",S.radius==="sq");b.classList.remove("fs-s","fs-l");if(S.size==="s")b.classList.add("fs-s");if(S.size==="l")b.classList.add("fs-l");markActive();xlate()}
function initI18n(){document.querySelectorAll('.setlbl').forEach(l=>{l.onclick=()=>togg(l);l.classList.add('open');togg(l)});regCustom();$("fontOpts").innerHTML=Object.keys(FONTS).map(k=>'<button class="opt" data-g="font" data-v="'+k+'" style="font-family:'+FONTS[k].f.replace(/"/g,"'")+',Arial" onclick="pickFont(\''+k+'\')">'+FONTS[k].n+"</button>").join("");document.querySelectorAll("option").forEach(o=>{if(!o.hasAttribute("value"))o.setAttribute("value",o.textContent.trim())});$("swatches").innerHTML=Object.keys(THEMES).map(k=>'<button class="opt" data-g="theme" data-v="'+k+'" onclick="setOpt(\'theme\',\''+k+'\')"><span class="dot" style="background:'+THEMES[k].p+'"></span>'+({gold:"أسود وذهبي",green:"أخضر",blue:"أزرق ملكي",purple:"بنفسجي",burgundy:"عنابي"})[k]+"</button>").join("");applySettings()}
F.forEach(x=>$(x).addEventListener("input",preview));
$("start").addEventListener("change",calcService);
if(localStorage.getItem("pro_dark")==="true")document.body.classList.add("dark");
load();
initI18n();
</script>
