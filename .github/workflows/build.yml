<div id="bookModal" class="modal"><div class="modalbox">
<div class="modalhead"><h2>إضافة كتاب رسمي</h2><button class="close" onclick="closeModal('bookModal')">✕</button></div>
<div class="grid">
<div class="field"><label>نوع الكتاب</label><select id="bookType"><option>كتاب رسمي</option><option>أمر إداري</option><option>أمر وزاري</option><option>تأييد</option><option>تنسيب</option><option>نقل</option><option>ترفيع</option><option>علاوة</option><option>أخرى</option></select></div>
<div class="field"><label>رقم الكتاب</label><input id="bookNo"></div><div class="field"><label>تاريخ الكتاب</label><input id="bookDate" type="date"></div><div class="field"><label>جهة الإصدار</label><input id="bookFrom"></div><div class="field"><label>موجه إلى</label><input id="bookTo"></div><div class="field"><label>الموضوع</label><input id="bookSubject"></div><div class="field wide"><label>إرفاق صورة / PDF</label><input id="bookFile" type="file" accept="image/*,.pdf"></div>
</div><div class="actions"><button class="btn primary" onclick="addBook()">إضافة</button><button class="btn soft" onclick="closeModal('bookModal')">إلغاء</button></div>
</div></div>

<script>
const F=["name","mother","birth","birthPlace","gender","marital","children","phone","email","employee","job","grade","step","appointment","start","service","affiliation","school","directorate","department","section","province","district","lastRaise","raiseDate","promotion","nextDate","educationLevel","specialty","university","graduation","course","courseOrg","courseDate","courseDuration","address","notes"];
let people=[],current=-1,docs=[],books=[];
const $=id=>document.getElementById(id);

function load(){try{people=JSON.parse(localStorage.getItem("pro_people")||"[]")}catch(e){people=[]}renderPeople();updateStats()}
function save(){let p=read();if(!p.name.trim()){toast("اكتب اسم الموظف أولاً");return}p.docs=docs;p.books=books;if(current<0){people.push(p);current=people.length-1}else people[current]=p;if(!persist())return;renderPeople();updateStats();preview();toast("تم حفظ الملف بنجاح")}
function persist(){try{localStorage.setItem("pro_people",JSON.stringify(people));return true}catch(e){toast("المساحة ممتلئة: قلّل حجم المرفقات أو أنشئ نسخة احتياطية");return false}}
function read(){let o={};F.forEach(x=>o[x]=$(x).value);return o}
function fill(p){F.forEach(x=>$(x).value=p?.[x]||"");docs=p?.docs||[];books=p?.books||[];preview();renderDocs();renderBooks()}
function newPerson(){current=-1;fill({});toast("تم فتح ملف جديد");window.scrollTo(0,0)}
function openPerson(i){current=i;fill(people[i]);toast("تم فتح ملف الموظف");window.scrollTo(0,0)}
function deletePerson(){if(current<0){toast("حدد موظفاً أولاً");return}if(!confirm(tr("حذف ملف الموظف؟")))return;people.splice(current,1);localStorage.setItem("pro_people",JSON.stringify(people));newPerson();renderPeople();updateStats();toast("تم الحذف")}
function preview(){$("pName").textContent=$("name").value||"اسم الموظف";$("pInfo").textContent=($("job").value||"العنوان الوظيفي")+" — "+($("school").value||"المدرسة / المديرية")}
function renderPeople(){let q=($("search").value||"").toLowerCase(),a=people.map((p,i)=>({p,i})).filter(x=>(x.p.name+" "+x.p.employee).toLowerCase().includes(q)),b=$("peopleList");if(!a.length){b.innerHTML='<div class="empty">لا توجد ملفات موظفين</div>';return}b.innerHTML='<div class="table-wrap"><table class="table"><thead><tr><th>الاسم</th><th>الرقم الوظيفي</th><th>الوظيفة</th><th>المدرسة</th><th></th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.p.name)+'</td><td>'+esc(x.p.employee)+'</td><td>'+esc(x.p.job)+'</td><td>'+esc(x.p.school)+'</td><td><button class="btn soft" onclick="openPerson('+x.i+')">فتح</button></td></tr>').join("")+'</tbody></table></div>'}
function addDoc(){if(!$("docNo").value){toast("أدخل رقم الوثيقة");return}docs.push({type:$("docType").value,no:$("docNo").value,date:$("docDate").value,expiry:$("docExpiry").value,from:$("docFrom").value});renderDocs();closeModal("docModal");clearIds(["docNo","docDate","docExpiry","docFrom"]);toast("تمت إضافة الوثيقة")}
function renderDocs(){let t=$("docsTable");if(!docs.length){t.innerHTML='<tr><td colspan="6" class="empty">لا توجد أوراق ثبوتية</td></tr>';return}t.innerHTML=docs.map((d,i)=>'<tr><td><span class="badge">'+esc(d.type)+'</span></td><td>'+esc(d.no)+'</td><td>'+esc(d.date)+'</td><td>'+esc(d.expiry)+expBadge(d.expiry)+'</td><td>'+esc(d.from)+'</td><td><button class="btn danger" onclick="removeDoc('+i+')">حذف</button></td></tr>').join("")}
function removeDoc(i){docs.splice(i,1);renderDocs();toast("تم حذف الوثيقة")}
function addBook(){let f=$("bookFile").files[0];if(!$("bookNo").value&&!$("bookSubject").value){toast("أدخل رقم الكتاب أو موضوعه");return}if(f&&f.size>1500000){toast("حجم المرفق كبير (الحد 1.5 ميغابايت)");return}if(f){let r=new FileReader();r.onload=()=>pushBook(f,r.result);r.readAsDataURL(f)}else pushBook(null,"")}
function pushBook(f,data){books.push({type:$("bookType").value,no:$("bookNo").value,date:$("bookDate").value,from:$("bookFrom").value,to:$("bookTo").value,subject:$("bookSubject").value,file:f?f.name:"",data:data});renderBooks();closeModal("bookModal");clearIds(["bookNo","bookDate","bookFrom","bookTo","bookSubject"]);$("bookFile").value="";toast("تمت إضافة الكتاب الرسمي")}
function renderBooks(){let t=$("booksTable");if(!books.length){t.innerHTML='<tr><td colspan="8" class="empty">لا توجد كتب رسمية</td></tr>';return}t.innerHTML=books.map((b,i)=>'<tr><td><span class="badge">'+esc(b.type)+'</span></td><td>'+esc(b.no)+'</td><td>'+esc(b.date)+'</td><td>'+esc(b.subject)+'</td><td>'+esc(b.from)+'</td><td>'+esc(b.to)+'</td><td>'+(b.data?'<a class="lnk" onclick="openBookFile('+i+')">'+esc(b.file)+'</a>':esc(b.file||"—"))+'</td><td><button class="btn danger" onclick="removeBook('+i+')">حذف</button></td></tr>').join("")}
function removeBook(i){books.splice(i,1);renderBooks();toast("تم حذف الكتاب")}
function openBookFile(i){let b=books[i];if(!b||!b.data)return;fetch(b.data).then(r=>r.blob()).then(bl=>window.open(URL.createObjectURL(bl),"_blank"))}
function expBadge(d){if(!d)return"";let days=Math.ceil((new Date(d)-new Date())/864e5);if(days<0)return' <span class="badge bad">منتهية</span>';if(days<=90)return' <span class="badge warn">تنتهي بعد '+days+' يوم</span>';return""}
function calcService(){let v=$("start").value;if(!v)return;let y=Math.floor((new Date()-new Date(v))/(365.25*864e5));if(y>=0)$("service").value=y}
function exportCSV(){if(!people.length){toast("لا توجد بيانات للتصدير");return}let q=v=>'"'+String(v||"").replace(/"/g,'""')+'"',rows=[F.map(q).join(",")].concat(people.map(p=>F.map(k=>q(p[k])).join(",")));let blob=new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="الموظفين.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast("تم تصدير الملف")}
function exportPDF(){let n=$("name").value.trim();if(!n){toast("اكتب اسم الموظف أولاً");return}let old=document.title;document.title="ملف الموظف - "+n;window.addEventListener("afterprint",()=>{document.title=old},{once:true});toast("اختر «حفظ كـ PDF» من نافذة الطباعة");setTimeout(()=>window.print(),400)}
function clearIds(a){a.forEach(x=>$(x).value="")}
function tab(btn,id){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));btn.classList.add("active");$(id).classList.add("active")}
function openModal(id){$(id).classList.add("show")}function closeModal(id){$(id).classList.remove("show")}
function updateStats(){}
function backup(){let blob=new Blob([JSON.stringify(people,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="بنك_المعلومات_الاحتياطي.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast("تم إنشاء النسخة الاحتياطية")}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{people=JSON.parse(r.result);localStorage.setItem("pro_people",JSON.stringify(people));renderPeople();updateStats();toast("تم استرجاع البيانات")}catch(x){toast("ملف النسخة الاحتياطية غير صالح")}};r.readAsText(f)}
function toggleDark(){document.body.classList.toggle("dark");localStorage.setItem("pro_dark",document.body.classList.contains("dark"))}
function toast(t){let x=$("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",2200)}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

