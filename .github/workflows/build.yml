<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بنك المعلومات الشخصية | نظام الإدارة</title>
<style>
:root{--p:#16130c;--p2:#2a2415;--gold:#d4a62a;--bg:#f5f3ee;--h1:#0a0a0a;--h2:#2b2412;--tint:#f3ead0;--tint2:#f4f0e6;--dp:#d4a62a;--card:#fff;--text:#17211f;--muted:#71807c;--line:#e6e0d0;--danger:#b42318;--shadow:0 8px 28px #1a14040f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ff,Arial,Tahoma,sans-serif)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;padding:6px 5%;box-shadow:0 4px 18px #0002}
.head{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;align-items:center;gap:9px}.logo{width:30px;height:30px;border:2px solid #d4a62a;border-radius:50%;display:grid;place-items:center;font-size:15px;background:#ffffff14}
h1{margin:0;font-size:15px}.head p{margin:1px 0 0;color:#e8d9a8;font-size:10px}.head button{background:#ffffff18;color:#fff;border:1px solid #ffffff44;border-radius:9px;padding:5px 9px;font-size:13px}
.wrap{max-width:1180px;margin:20px auto;padding:0 15px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px}.stat{background:var(--card);border-radius:14px;padding:17px;box-shadow:var(--shadow);border-right:4px solid var(--gold)}.stat b{font-size:25px;display:block;color:var(--p)}.stat span{color:var(--muted);font-size:13px}
.toolbar,.card{background:var(--card);border-radius:15px;box-shadow:var(--shadow);padding:17px;margin-bottom:15px}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.search{flex:1;min-width:220px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:#fff;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #d4a62a22}textarea{min-height:85px;resize:vertical}
.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:bold}.primary{background:var(--p);color:#fff}.gold{background:var(--gold);color:#16130c}.soft{background:var(--tint);color:var(--p)}.danger{background:#fdecea;color:var(--danger)}
.profile{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center}.avatar{width:90px;height:90px;border-radius:50%;background:var(--tint);border:3px solid var(--gold);display:grid;place-items:center;font-size:40px}.profile h2{margin:0 0 5px;color:var(--p)}.profile p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;background:var(--tint);color:var(--p);border:0;padding:10px 14px;border-radius:9px}.tab.active{background:var(--p);color:#fff}
.section{display:none}.section.active{display:block}.title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.title h2{margin:0;color:var(--p);font-size:19px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:13px;margin-bottom:5px;color:#4f5d59}.wide{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:start;font-size:13px}.table th{background:var(--tint2);color:var(--p)}.table tr:last-child td{border-bottom:0}
.empty{text-align:center;padding:25px;color:var(--muted)}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:var(--tint);color:var(--p);font-size:12px}
a.lnk{color:var(--p);font-weight:bold;cursor:pointer;text-decoration:underline}.badge.bad{background:#fdecea;color:var(--danger)}.badge.warn{background:#fff3d6;color:#8a5a00}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}.setlbl{font-weight:bold;color:var(--p);margin-top:6px;padding:11px 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}.setlbl::after{content:'▾';color:var(--gold)}.setlbl.open::after{content:'▴'}.setlbl+.opts{margin-top:12px}.btn.wa{background:#25d366;color:#fff;text-decoration:none;display:inline-block}.terms{font-size:13px;line-height:1.9;max-height:240px;overflow:auto;margin-top:8px}.terms ol{margin:0;padding-inline-start:22px}.terms li{margin-bottom:6px}.sublbl{font-weight:bold;font-size:13px;color:var(--muted);margin:8px 2px 0}.opt{border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:9px 14px}.opt.active{border-color:var(--gold);box-shadow:0 0 0 2px #d4a62a55;font-weight:bold}.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-inline-end:6px;border:1px solid #8886}.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0}.sw.active{box-shadow:0 0 0 3px var(--gold)}
body.sq .btn,body.sq .card,body.sq .toolbar,body.sq input,body.sq select,body.sq textarea,body.sq .tab,body.sq .modalbox,body.sq .table-wrap,body.sq .badge,body.sq .close,body.sq .head button,body.sq .toast,body.sq .opt{border-radius:4px!important}body.fs-s{zoom:.92}body.fs-l{zoom:1.12}
@keyframes secIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes fieldIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}@keyframes tabPop{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.section.active{animation:secIn .35s ease}.section.active .field{animation:fieldIn .45s ease both}.tab{transition:background .25s,color .25s,transform .15s}.tab:active{transform:scale(.93)}.tab.active{animation:tabPop .35s ease}
.section.active .field:nth-child(1){animation-delay:35ms}.section.active .field:nth-child(2){animation-delay:70ms}.section.active .field:nth-child(3){animation-delay:105ms}.section.active .field:nth-child(4){animation-delay:140ms}.section.active .field:nth-child(5){animation-delay:175ms}.section.active .field:nth-child(6){animation-delay:210ms}.section.active .field:nth-child(7){animation-delay:245ms}.section.active .field:nth-child(8){animation-delay:280ms}.section.active .field:nth-child(9){animation-delay:315ms}.section.active .field:nth-child(10){animation-delay:350ms}.section.active .field:nth-child(11){animation-delay:385ms}.section.active .field:nth-child(12){animation-delay:420ms}
@media(prefers-reduced-motion:reduce){.section.active,.section.active .field,.tab.active{animation:none}}
@media print{.section.active,.section.active .field{animation:none}}
footer{text-align:center;color:var(--muted);font-size:12px;padding:18px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--h1);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 25px #0003;display:none;z-index:10}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.modalbox{background:var(--card);color:var(--text);border-radius:15px;max-width:600px;width:100%;padding:20px;max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:#eee;border:0;border-radius:8px;padding:7px 10px}
body.dark{--bg:#0c0c0c;--card:#171614;--text:#efe9d8;--muted:#b0a88f;--line:#34301f;--p:var(--dp);--tint:#26231a;--tint2:#26231a}body.dark .close{background:#26231a;color:var(--text)}body.dark .primary,body.dark .tab.active{color:#111}body.dark .soft{background:#26231a}body.dark .tab{background:#26231a}body.dark input,body.dark select,body.dark textarea{background:#0f0e0c;color:#fff}body.dark .table th{background:#26231a}
@media(max-width:700px){.head{align-items:flex-start}.stats{grid-template-columns:1fr 1fr}.profile{grid-template-columns:70px 1fr}.profile .actions{grid-column:1/-1}.avatar{width:70px;height:70px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
@media print{header,.stats,.toolbar,.tabs,.actions,.no-print,footer{display:none!important}.card{box-shadow:none;border:1px solid #ddd}.section{display:block!important}.profile{border:1px solid #ddd}}
</style>
</head>
<body>
<header>
<div class="head">
<div class="brand"><div class="logo">م</div><div><h1>بنك المعلومات الشخصية</h1><p>نظام إدارة البيانات الشخصية والوظيفية</p></div></div>
<div style="display:flex;gap:8px"><button onclick="toggleDark()">☾ الوضع الليلي</button><button onclick="openSettings()">⚙️</button></div>
</div>
</header>

<main class="wrap">
<div class="toolbar no-print">
<input class="search" id="search" placeholder="🔎 ابحث بالاسم أو الرقم الوظيفي..." oninput="renderPeople()">
<button class="btn primary" onclick="newPerson()">＋ موظف جديد</button>
<button class="btn soft" onclick="backup()">نسخة احتياطية</button>
<button class="btn soft" onclick="exportCSV()">تصدير Excel</button>
<button class="btn soft" onclick="restoreInput.click()">استرجاع</button>
<input id="restoreInput" type="file" accept=".json" style="display:none" onchange="restore(event)">
</div>

<div class="card profile">
<div class="avatar">👤</div>
<div><h2 id="pName">اسم الموظف</h2><p id="pInfo">العنوان الوظيفي — المدرسة / المديرية</p></div>
<div class="actions no-print"><button class="btn gold" onclick="window.print()">🖨️ طباعة الملف</button><button class="btn primary" onclick="exportPDF()">📄 تصدير PDF</button></div>
</div>

<div class="card">
<div class="tabs no-print">
<button class="tab active" onclick="tab(this,'personal')">👤 الشخصية</button>
<button class="tab" onclick="tab(this,'job')">💼 الوظيفة</button>
<button class="tab" onclick="tab(this,'education')">🎓 التعليم</button>
<button class="tab" onclick="tab(this,'docs')">📎 الثبوتيات</button>
<button class="tab" onclick="tab(this,'books')">📚 الكتب الرسمية</button>
<button class="tab" onclick="tab(this,'notes')">📝 الملاحظات</button>
</div>

<section id="personal" class="section active">
<div class="title"><h2>المعلومات الشخصية</h2></div>
<div class="grid">
<div class="field"><label>الاسم الكامل</label><input id="name"></div><div class="field"><label>اسم الأم</label><input id="mother"></div>
<div class="field"><label>تاريخ الميلاد</label><input id="birth" type="date"></div><div class="field"><label>مكان الولادة</label><input id="birthPlace"></div>
<div class="field"><label>الجنس</label><select id="gender"><option>ذكر</option><option>أنثى</option></select></div><div class="field"><label>الحالة الاجتماعية</label><select id="marital"><option>أعزب</option><option>متزوج</option><option>مطلق</option><option>أرمل</option></select></div>
<div class="field"><label>عدد الأطفال</label><input id="children" type="number" min="0"></div><div class="field"><label>رقم الهاتف</label><input id="phone" type="tel"></div>
<div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div>
</div></section>

<section id="job" class="section">
<div class="title"><h2>المعلومات الوظيفية</h2></div>
<div class="grid">
<div class="field"><label>الرقم الوظيفي</label><input id="employee"></div><div class="field"><label>العنوان الوظيفي</label><input id="job"></div>
<div class="field"><label>الدرجة</label><input id="grade"></div><div class="field"><label>المرحلة</label><input id="step"></div>
<div class="field"><label>تاريخ التعيين</label><input id="appointment" type="date"></div><div class="field"><label>تاريخ المباشرة</label><input id="start" type="date"></div>
<div class="field"><label>سنوات الخدمة</label><input id="service" type="number" min="0"></div><div class="field"><label>جهة الانتساب</label><input id="affiliation"></div>
<div class="field"><label>المدرسة / الدائرة</label><input id="school"></div><div class="field"><label>المديرية</label><input id="directorate"></div>
<div class="field"><label>القسم</label><input id="department"></div><div class="field"><label>الشعبة</label><input id="section"></div>
<div class="field"><label>المحافظة</label><input id="province"></div><div class="field"><label>القضاء / الناحية</label><input id="district"></div>
<div class="field"><label>آخر علاوة</label><input id="lastRaise"></div><div class="field"><label>تاريخ آخر علاوة</label><input id="raiseDate" type="date"></div>
<div class="field"><label>آخر ترفيع</label><input id="promotion"></div><div class="field"><label>تاريخ الاستحقاق القادم</label><input id="nextDate" type="date"></div>
</div></section>

<section id="education" class="section">
<div class="title"><h2>المؤهلات والدورات</h2></div>
<div class="grid">
<div class="field"><label>الشهادة</label><select id="educationLevel"><option>دبلوم</option><option>بكالوريوس</option><option>دبلوم عالي</option><option>ماجستير</option><option>دكتوراه</option></select></div>
<div class="field"><label>الاختصاص</label><input id="specialty"></div><div class="field"><label>الجامعة / المعهد</label><input id="university"></div><div class="field"><label>سنة التخرج</label><input id="graduation" type="number"></div>
<div class="field"><label>اسم آخر دورة</label><input id="course"></div><div class="field"><label>جهة الدورة</label><input id="courseOrg"></div><div class="field"><label>تاريخ الدورة</label><input id="courseDate" type="date"></div><div class="field"><label>مدة الدورة</label><input id="courseDuration"></div>
</div></section>

<section id="docs" class="section">
<div class="title"><h2>الأوراق الثبوتية</h2><button class="btn primary no-print" onclick="openModal('docModal')">＋ إضافة وثيقة</button></div>
<div class="table-wrap"><table class="table"><thead><tr><th>النوع</th><th>الرقم</th><th>الإصدار</th><th>الانتهاء</th><th>جهة الإصدار</th><th></th></tr></thead><tbody id="docsTable"></tbody></table></div>
</section>

<section id="books" class="section">
<div class="title"><h2>الكتب الرسمية</h2><button class="btn primary no-print" onclick="openModal('bookModal')">＋ إضافة كتاب رسمي</button></div>
<div class="table-wrap"><table class="table"><thead><tr><th>النوع</th><th>الرقم</th><th>التاريخ</th><th>الموضوع</th><th>من</th><th>إلى</th><th>مرفق</th><th></th></tr></thead><tbody id="booksTable"></tbody></table></div>
</section>

<section id="notes" class="section">
<div class="title"><h2>العنوان والملاحظات</h2></div>
<div class="grid">
<div class="field wide"><label>العنوان الكامل</label><textarea id="address"></textarea></div>
<div class="field wide"><label>ملاحظات إدارية</label><textarea id="notes"></textarea></div>
</div>
</section>

<div class="actions no-print">
<button class="btn primary" onclick="save()">💾 حفظ البيانات</button><button class="btn soft" onclick="newPerson()">موظف جديد</button><button class="btn gold" onclick="window.print()">🖨️ طباعة</button><button class="btn primary" onclick="exportPDF()">📄 تصدير PDF</button><button class="btn danger" onclick="deletePerson()">حذف الموظف</button>
</div>
</div>

<div class="card no-print"><div class="title"><h2>قائمة الموظفين</h2></div><div id="peopleList"></div></div>
</main>

<footer>بنك المعلومات الشخصية © 2026 — الإصدار 2.0 — يعمل محليًا على جهازك</footer>
<div id="toast" class="toast"></div>

<div id="setModal" class="modal"><div class="modalbox">
<div class="modalhead"><h2>⚙️ الإعدادات</h2><button class="close" onclick="closeModal('setModal')">✕</button></div>
<div class="setlbl">اللغة</div><div class="opts"><button class="opt" data-g="lang" data-v="ar" onclick="setOpt('lang','ar')">العربية</button><button class="opt" data-g="lang" data-v="ku" onclick="setOpt('lang','ku')">کوردی</button><button class="opt" data-g="lang" data-v="en" onclick="setOpt('lang','en')">English</button></div>
<div class="setlbl">المظهر</div>
<div class="sublbl">لون التطبيق</div><div class="opts" id="swatches"></div>
<div class="sublbl">الخط</div><div class="opts" id="fontOpts"></div><div class="opts"><button class="opt" onclick="fontFile.click()">＋ رفع ملف خط (مثل البغدادي)</button><input id="fontFile" type="file" accept=".ttf,.otf,.woff,.woff2" style="display:none" onchange="loadFont(event)"></div>
<div class="sublbl">وضع العرض</div><div class="opts"><button class="opt" data-g="mode" data-v="light" onclick="setMode(false)">فاتح</button><button class="opt" data-g="mode" data-v="dark" onclick="setMode(true)">داكن</button></div>
<div class="sublbl">زوايا العناصر</div><div class="opts"><button class="opt" data-g="radius" data-v="round" onclick="setOpt('radius','round')">مدورة</button><button class="opt" data-g="radius" data-v="sq" onclick="setOpt('radius','sq')">حادة</button></div>
<div class="sublbl">حجم الخط</div><div class="opts"><button class="opt" data-g="size" data-v="s" onclick="setOpt('size','s')">صغير</button><button class="opt" data-g="size" data-v="m" onclick="setOpt('size','m')">متوسط</button><button class="opt" data-g="size" data-v="l" onclick="setOpt('size','l')">كبير</button></div>
<div class="setlbl">التواصل</div><div class="opts"><a class="btn wa" href="https://wa.me/9647713235036" target="_blank" rel="noopener">💬 تواصل عبر واتساب <span dir="ltr">0771 323 5036</span></a></div>
<div class="setlbl">الشروط والأحكام</div><div class="terms"><ol><li>جميع البيانات التي تُدخلها تُحفظ محليًا على جهازك فقط، ولا تُرسل إلى أي خادم.</li><li>أنت المسؤول عن دقة البيانات وعن حمايتها، وعن حماية جهازك من الوصول غير المصرّح به.</li><li>يُنصح بإنشاء نسخة احتياطية بشكل دوري، فحذف بيانات المتصفح أو التطبيق أو تغيير الجهاز قد يؤدي إلى فقدان البيانات.</li><li>يحتوي التطبيق على بيانات شخصية حساسة، فلا تشاركها أو تطبعها إلا لجهة مخوّلة بذلك.</li><li>عند اختيار خطوط من الإنترنت قد يُحمَّل الخط من خدمة Google Fonts، وزر واتساب يفتح تطبيقًا خارجيًا يخضع لشروطه.</li><li>يُقدَّم التطبيق كما هو دون أي ضمان، ولا يتحمل مطوّره مسؤولية أي خسارة ناتجة عن استخدامه.</li><li>استمرارك في استخدام التطبيق يعني موافقتك على هذه الشروط، وقد تُحدَّث عند صدور إصدارات جديدة.</li></ol></div>
<div class="setlbl">سياسة الخصوصية</div><div class="terms"><ol><li>لا يجمع التطبيق أي بيانات عنك، ولا يتطلب إنشاء حساب أو تسجيل دخول.</li><li>البيانات التي تُدخلها (الشخصية والوظيفية والوثائق والكتب الرسمية ومرفقاتها) تُخزَّن محليًا على جهازك فقط.</li><li>لا نشارك بياناتك مع أي طرف ثالث، ولا نستخدم إعلانات أو أدوات تتبع.</li><li>عند اختيار خط من الإنترنت يتصل جهازك بخدمة Google Fonts لتحميله، وقد تصلها معلومات اتصال عادية مثل عنوان IP.</li><li>ملفات النسخة الاحتياطية وملفات التصدير (Excel وPDF) تُحفظ في المكان الذي تختاره، وأنت المسؤول عن حمايتها.</li><li>يمكنك حذف أي ملف موظف في أي وقت، ومسح كل البيانات من إعدادات المتصفح أو التطبيق.</li><li>للاستفسار عن الخصوصية تواصل معنا عبر واتساب من قسم التواصل.</li><li>قد تُحدَّث سياسة الخصوصية هذه عند صدور إصدارات جديدة.</li></ol></div>
<div class="actions"><button class="btn soft" onclick="resetSettings()">إعادة الضبط</button><button class="btn primary" onclick="closeModal('setModal')">إغلاق</button></div>
</div></div>

<div id="docModal" class="modal"><div class="modalbox">
<div class="modalhead"><h2>إضافة ورقة ثبوتية</h2><button class="close" onclick="closeModal('docModal')">✕</button></div>
<div class="grid">
<div class="field"><label>نوع الوثيقة</label><select id="docType"><option>البطاقة الوطنية</option><option>بطاقة السكن</option><option>هوية الأحوال المدنية</option><option>شهادة الجنسية</option><option>جواز السفر</option><option>هوية الموظف</option><option>أخرى</option></select></div>
<div class="field"><label>رقم الوثيقة</label><input id="docNo"></div><div class="field"><label>تاريخ الإصدار</label><input id="docDate" type="date"></div><div class="field"><label>تاريخ الانتهاء</label><input id="docExpiry" type="date"></div><div class="field"><label>جهة الإصدار</label><input id="docFrom"></div>
</div><div class="actions"><button class="btn primary" onclick="addDoc()">إضافة</button><button class="btn soft" onclick="closeModal('docModal')">إلغاء</button></div>
